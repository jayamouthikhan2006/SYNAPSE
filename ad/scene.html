<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* custom "case-file" HUD */
.sh-tl{position:absolute;left:58px;top:44px;display:flex;gap:18px;align-items:baseline;font-family:MDMono;font-size:14px;letter-spacing:.24em}
.sh-tl b{font-family:MDUnb;font-weight:900;letter-spacing:.08em;font-size:17px}
.sh-tl span{opacity:.6}
.sh-tr{position:absolute;right:58px;top:46px;font-family:MDMono;font-size:14px;letter-spacing:.24em;font-weight:600}
.sh-rail{position:absolute;left:58px;right:58px;bottom:38px;display:flex;gap:8px;align-items:center;height:8px}
.sh-rail i{flex:1;height:3px;background:var(--hud);opacity:.2;border-radius:2px}
.sh-rail i.done{opacity:.55}.sh-rail i.on{opacity:1;height:7px}
</style></head>
<body><div id="stage"></div>
<script src="engine.js"></script>
<script>
/* SYNAPSE — "CIVIC GRAPH" cut. 128 BPM. Cold open (2 bars) → title drop → idea → 15 feature chapters (2 bars each)
   → break → 8th-note kinetic drop (2 bars) → mark lockup. Every chapter shows a real screen idea from the app. */
const {E,P,clamp,lerp,W,H,PI,type:T,trans:X}=MD;
const C={night:'#070D24',navy:'#0F1B3D',ice:'#EEF3FF',saff:'#FF9F1C',teal:'#19D3C5',alert:'#FF3D5A',brand:'#2F5BEA',ink:'#0B1433',mist:'#8C9BC4',line:'#D5DCEE'};
MD.theme={bg:C.night,fg:C.ice}; MD.brand='SYNAPSE'; MD.bpm=128; MD.duration=74.6;
const B=MD.beat(), BAR=MD.bar(), e8=B/2, bar=n=>n*BAR;
const GROT=(w,s)=>`${w} ${s}px MDGrot`, UNB=s=>`900 ${s}px MDUnb`, MONO=(s,w=500)=>`${w} ${s}px MDMono`;
const TAMIL='600 44px "Nirmala UI","Latha","Noto Sans Tamil",sans-serif';

// ---------------------------------------------------------------- drawing helpers
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function card(c,x,y,w,h,{fill='#fff',r=22,shadow=true,stroke=null,lw=2}={}){c.save();if(shadow){c.shadowColor='rgba(7,13,36,.22)';c.shadowBlur=34;c.shadowOffsetY=14;}
  rr(c,x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill();}c.restore();if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;rr(c,x,y,w,h,r);c.stroke();}}
function txt(c,s,x,y,{font=GROT(500,24),col=C.ice,align='left',a=1,ls=0}={}){c.save();c.globalAlpha*=a;c.font=font;c.fillStyle=col;c.textAlign=align;c.letterSpacing=ls+'px';c.fillText(s,x,y);c.restore();}
function tw(c,s,font,ls=0){c.save();c.font=font;c.letterSpacing=ls+'px';const w=c.measureText(s).width;c.restore();return w;}
function pill(c,s,x,y,{font=MONO(15,600),fill=C.alert,col=C.ice,h=40,pad=20,ls=2,stroke=null,align='left'}={}){const w=tw(c,s,font,ls)+pad*2;const x0=align==='center'?x-w/2:align==='right'?x-w:x;
  rr(c,x0,y,w,h,h/2);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke();}txt(c,s,x0+pad,y+h/2+6,{font,col,ls});return w;}
// pop a drawing in around (cx,cy) with a back-out scale; fn(p) draws at final size
function pop(c,cx,cy,t,at,fn,{dur=.42,from=.4,dy=0}={}){const p=clamp((t-at)/dur);if(p<=0)return 0;const e=lerp(from,1,E.backOut(p,1.8));const v=1-E.expoOut(p);
  c.save();c.globalAlpha*=Math.min(1,p*3.5);c.translate(cx,cy+dy*v);c.scale(e,lerp(e,1,.35)+.0);c.translate(-cx,-cy);fn(p);c.restore();return p;}
function slideX(c,t,at,dist,fn,{dur=.38}={}){const p=P(t,at,dur,E.expoOut);if(t<at)return;c.save();c.translate(dist*(1-p),0);c.globalAlpha*=Math.min(1,(t-at)*8);fn(p);c.restore();}
function check(c,x,y,s,col,lw=4){c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(x-s*.5,y);c.lineTo(x-s*.12,y+s*.38);c.lineTo(x+s*.55,y-s*.4);c.stroke();}
function cross(c,x,y,s,col,lw=4){c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(x-s/2,y-s/2);c.lineTo(x+s/2,y+s/2);c.moveTo(x+s/2,y-s/2);c.lineTo(x-s/2,y+s/2);c.stroke();}
function tri(c,x,y,s,fill,mark=C.ice){c.fillStyle=fill;c.beginPath();c.moveTo(x,y-s*.62);c.lineTo(x+s*.62,y+s*.46);c.lineTo(x-s*.62,y+s*.46);c.closePath();c.lineJoin='round';c.strokeStyle=fill;c.lineWidth=s*.12;c.stroke();c.fill();
  c.fillStyle=mark;rr(c,x-s*.06,y-s*.3,s*.12,s*.42,s*.05);c.fill();c.beginPath();c.arc(x,y+s*.27,s*.075,0,7);c.fill();}
function lock(c,x,y,s,col){c.strokeStyle=col;c.lineWidth=s*.13;c.beginPath();c.arc(x,y-s*.18,s*.28,PI,0);c.stroke();c.fillStyle=col;rr(c,x-s*.42,y-s*.16,s*.84,s*.62,s*.1);c.fill();}
function shield(c,x,y,s,fill){c.fillStyle=fill;c.beginPath();c.moveTo(x,y-s*.6);c.quadraticCurveTo(x+s*.25,y-s*.42,x+s*.5,y-s*.44);c.quadraticCurveTo(x+s*.55,y+s*.25,x,y+s*.6);
  c.quadraticCurveTo(x-s*.55,y+s*.25,x-s*.5,y-s*.44);c.quadraticCurveTo(x-s*.25,y-s*.42,x,y-s*.6);c.fill();}
function hexPath(c,x,y,r,rot=0){c.beginPath();for(let i=0;i<6;i++){const a=rot+PI/6+i*PI/3;i?c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
// the SYNAPSE mark: a hub node and three satellites (same mark as the app's favicon), drawn on canvas
function mark(c,x,y,s,col,{grow=1,hub=null,pulse=0}={}){const sats=[[-.66,-.5],[.66,-.5],[0,.78]];c.lineCap='round';
  sats.forEach(([sx,sy],i)=>{const g=clamp(grow*3-i*.6);if(g<=0)return;c.strokeStyle=col;c.lineWidth=s*.085;c.beginPath();c.moveTo(x,y);c.lineTo(x+sx*s*g,y+sy*s*g);c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(x+sx*s*g,y+sy*s*g,s*.15*E.backOut(g),0,7);c.fill();});
  c.fillStyle=hub||col;c.beginPath();c.arc(x,y,s*(.27+.04*pulse)*E.backOut(clamp(grow*2)),0,7);c.fill();}
const HEX=MD.shape('hex',240);

// ---------------------------------------------------------------- HUD (custom case-file strip)
const CH=['DASHBOARD','INSTITUTION 360','FILE A COMPLAINT','LLM FIREWALL','AI MATCHING','ISSUE THREADS','ENFORCEMENT ACTIONS','ACE ALERTS','COORDINATION ROOM','PRIVATE BY DEFAULT','RESOLUTION ASSURANCE','COMPLAINT PASSPORT','ANALYTICS','AUDIT LEDGER','DEMO GUIDE'];
let hudOk=false;
MD.hudStyle=(hud,t,sc)=>{
  if(!hudOk){hud.innerHTML=`<div class="sh-tl"><b>SYNAPSE</b><span>SIH26264 · AICTE</span></div><div class="sh-tr" id="sht"></div><div class="sh-rail" id="shr">${CH.map(()=>'<i></i>').join('')}</div>`;hudOk=true;}
  hud.style.color=sc.hud||C.ice;hud.style.setProperty('--hud',sc.hud||C.ice);
  const ch=sc.ch||0;document.getElementById('sht').textContent=ch?`${String(ch).padStart(2,'0')} / 15  ·  ${CH[ch-1]}`:(sc.label||'');
  [...document.getElementById('shr').children].forEach((el,i)=>{el.className=i<ch-1?'done':i===ch-1?'on':'';});
  hud.style.opacity=sc.hudO??1;
};

// ---------------------------------------------------------------- chapter template
function fit(w,maxW){const cw=w.scrollWidth;if(cw>maxW){const fs=parseFloat(w.style.fontSize);w.style.fontSize=(fs*maxW/cw)+'px';}}
function head(h,s,{ch,name,claim,kicker,fg,acc}){
  s.hn=MD.word(h,String(ch).padStart(2,'0'),{cls:'f-unb',size:176,x:100,y:236,align:'left',color:'transparent',mask:false,style:`-webkit-text-stroke:3px ${acc}`});
  s.hk=MD.word(h,kicker,{cls:'f-mono',size:17,x:110,y:372,align:'left',color:acc,mask:false,style:'font-weight:600'});fit(s.hk,760);
  s.hname=name.map((l,i)=>{const w=MD.word(h,l,{cls:'f-unb',size:74,x:104,y:452+i*84,align:'left',color:fg});fit(w,760);return w;});
  const by=452+(name.length-1)*84+66;s.hby=by;
  s.hbar=MD.el('',`left:110px;top:${by}px;height:6px;width:0;background:${acc};border-radius:3px`);h.appendChild(s.hbar);
  s.hcl=claim.map((l,i)=>MD.word(h,l,{cls:'f-grot',size:46,x:108,y:by+76+i*58,align:'left',color:fg,style:'font-weight:500'}));
}
function headUp(s,t){
  T.maskRise(s.hn.letters,t,{at:0,stagger:.07,dur:.42});s.hn.style.transform=`translateY(-50%) scale(${1+.035*MD.pulse(t,8)*(t>.4?1:0)})`;s.hn.style.transformOrigin='0 50%';
  T.typeOn(s.hk.letters,t,{at:B*.6,cps:60});
  s.hname.forEach((w,i)=>{T.slam(w.letters,t,{at:.03+i*.09,stagger:.022,dur:.15,dist:520});T.rgbSplit(w,t,{at:.2+i*.09,dur:.3,dist:24,a:C.teal,b:C.alert});});
  s.hbar.style.width=(150*P(t,B*1.1,.45,E.expoOut))+'px';
  s.hcl.forEach((w,i)=>T.maskRise(w.letters,t,{at:B*2.2+i*.14,stagger:.011,dur:.36}));
}
function chapter(ch,o){const st=bar(2+2*ch);
  MD.scenes.push({start:st,end:st+bar(2),bg:o.bg,hud:o.fg,ch,label:CH[ch-1],
    build(h,s){s.c=MD.canvas(h);head(h,s,{ch,...o});o.build&&o.build(h,s);},
    update(t,s,g){s.c.clearRect(0,0,W,H);headUp(s,t);o.draw(s.c,t,s,g);}});}

// =====================================================================================================
// 0  COLD OPEN — one complaint, three blind silos (bars 0–2)
// =====================================================================================================
MD.scenes.push({start:0,end:bar(2),bg:C.night,hud:C.ice,hudO:0,label:'',
  build(h,s){s.c=MD.canvas(h);
    s.cap=MD.word(h,'three bureaus. one complaint. none aware of the others.',{cls:'f-grot',size:46,y:905,color:C.ice});},
  update(t,s){const c=s.c;c.clearRect(0,0,W,H);
    // anticipation squash into the drop
    const ant=P(t,bar(2)-.24,.24,E.in3);s.host.style.transform=`scale(${1+.05*ant},${1-.12*ant})`;
    const split=P(t,bar(1),.42,E.expoOut), sp=clamp((t-bar(1))/.42);
    txt(c,'14 SEP 2026  ·  10:30  ·  CENTRAL GRIEVANCE PORTAL',W/2,262,{font:MONO(17,600),col:C.mist,align:'center',ls:4,a:P(t,.08,.3)*(1-split)});
    const xs=[420,960,1500], names=['PGRC','REGULATION BUREAU','VIGILANCE CELL'], tags=['as a student grievance','as a norms violation','as a financial irregularity'];
    const n=t<bar(1)?1:3;
    for(let k=0;k<n;k++){
      const cx=t<bar(1)?W/2:lerp(W/2,xs[k],split), wFull=t<bar(1)?840:lerp(840,460,split);
      const open=P(t,.02,.32,E.expoOut), w=wFull*(t<bar(1)?open:1), hh=t<bar(1)?lerp(6,210,P(t,B*.55,.3,E.backOut)):lerp(210,170,split);
      const stretch=t>=bar(1)?1+.5*Math.sin(PI*clamp(sp))*Math.abs(k-1):1;
      c.save();c.translate(cx,540);c.scale(stretch,1/Math.sqrt(stretch));
      card(c,-w/2,-hh/2,w,hh,{fill:C.navy,r:20,shadow:false,stroke:k===1||t<bar(1)?C.saff:'rgba(140,155,196,.5)'});
      if(hh>100){const L=-w/2+36, sc=t<bar(1)?1:lerp(1,.56,split);c.save();c.translate(L,0);c.scale(sc,sc);
        const typ=(str,at)=>str.slice(0,Math.floor(clamp((t-at)*55,0,str.length)));
        txt(c,typ('C-2026-08765',B*1),0,-48,{font:MONO(24,700),col:C.saff,ls:3});
        txt(c,typ('Excess fee collected. No refund.',B*1.8),0,12,{font:GROT(600,46),col:C.ice});
        txt(c,typ('ABC INSTITUTE OF TECHNOLOGY  ·  BENGALURU',B*2.6),0,62,{font:MONO(17,500),col:C.mist,ls:3});c.restore();}
      c.restore();
      if(t>=bar(1)){const a=P(t,bar(1)+.12+k*.06,.35);
        txt(c,names[k],xs[k],372,{font:UNB(30),col:C.ice,align:'center',a});
        txt(c,tags[k],xs[k],690,{font:MONO(17,600),col:k===1?C.saff:C.mist,align:'center',a:P(t,bar(1)+B*.8+k*.08,.3),ls:2});}
    }
    // walls slam down between the silos, bounce, then pulse on each beat
    [690,1230].forEach((x,i)=>{const p=E.bounce(clamp((t-bar(1)-B*1.3-i*.07)/.5));if(p<=0)return;const hgt=600*p,pul=MD.pulse(t,9);
      c.fillStyle=C.alert;c.shadowColor=C.alert;c.shadowBlur=20+30*pul;c.fillRect(x-4-2*pul,240,8+4*pul,hgt);c.shadowBlur=0;
      cross(c,x,240+hgt/2,26,C.ice,5);});
    T.maskRise(s.cap.letters,t,{at:bar(1)+B*2.2,stagger:.012,dur:.36});
    s.cap.style.opacity=1-ant;
  }});

// =====================================================================================================
// 1  TITLE DROP (bar 2)
// =====================================================================================================
const NODES=(()=>{const r=MD.rng(17),a=[];for(let i=0;i<46;i++){const ang=r()*2*PI,d=260+r()*620;a.push({x:W/2+Math.cos(ang)*d*1.25,y:H/2+Math.sin(ang)*d*.62,s:3+r()*7,c:[C.teal,C.saff,C.ice,C.brand][i%4],d:r()*.25});}return a;})();
MD.scenes.push({start:bar(2),end:bar(3),bg:C.navy,hud:C.ice,hudO:0,label:'',
  build(h,s){s.c=MD.canvas(h);
    s.t=MD.word(h,'SYNAPSE',{cls:'f-unb',size:236,y:520,color:C.ice});
    s.tag=MD.word(h,'The Institutional Accountability Graph',{cls:'f-grot',size:62,y:705,color:C.ice,style:'font-weight:500'});
    s.meta=MD.word(h,'SIH26264  ·  SMART INDIA HACKATHON 2026  ·  FOR AICTE',{cls:'f-mono',size:19,y:792,color:C.saff,mask:false,style:'font-weight:600'});},
  update(t,s){const c=s.c;c.clearRect(0,0,W,H);
    // graph burst: nodes spring outward from the centre, links draw between near neighbours
    NODES.forEach((n,i)=>{const p=E.spring(clamp((t-n.d)/.9),1.1,4.5);n.cx=lerp(W/2,n.x,p);n.cy=lerp(H/2,n.y,p);});
    c.lineWidth=1.5;NODES.forEach((n,i)=>{for(let j=i+1;j<NODES.length;j++){const m=NODES[j],d=Math.hypot(n.x-m.x,n.y-m.y);if(d<300){c.strokeStyle=`rgba(140,155,196,${.22*(1-d/300)*P(t,.25,.5)})`;c.beginPath();c.moveTo(n.cx,n.cy);c.lineTo(m.cx,m.cy);c.stroke();}}});
    NODES.forEach(n=>{c.fillStyle=n.c;c.beginPath();c.arc(n.cx,n.cy,n.s*(1+.5*MD.pulse(t,7)),0,7);c.fill();});
    pop(c,W/2,250,t,.05,()=>mark(c,W/2,262,70,C.saff,{grow:P(t,.05,.6),hub:C.ice,pulse:MD.pulse(t,8)}),{dur:.5});
    T.slam(s.t.letters,t,{at:0,stagger:.035,dur:.15,dist:1000});T.rgbSplit(s.t,t,{at:.2,dur:.32,dist:44,a:C.teal,b:C.alert});
    s.t.style.transform=`translateY(-50%) scale(${1+.03*MD.pulse(t,9)*(t>.5?1:0)})`;
    T.maskRise(s.tag.letters,t,{at:B*1.2,stagger:.012,dur:.36});
    T.typeOn(s.meta.letters,t,{at:B*2.1,cps:70});
  }});
MD.overlays.push(t=>X.flash(t,bar(2),{dur:.14,color:C.saff,max:.7}));
MD.overlays.push(t=>X.blinds(t,bar(3),{n:12,color:C.ice}));

// =====================================================================================================
// 2  THE IDEA — the college is the node (bar 3)
// =====================================================================================================
const BUR=[['PGRC',C.teal],['REGULATION',C.brand],['VIGILANCE',C.alert],['FINANCE',C.saff],['ACADEMIC','#7B8BBF'],['ESTABLISHMENT','#5B6B8C']];
MD.scenes.push({start:bar(3),end:bar(4),bg:C.ice,hud:C.ink,hudO:0,label:'',
  build(h,s){s.c=MD.canvas(h);
    s.l1=MD.word(h,'NOT THE COMPLAINT.',{cls:'f-unb',size:52,x:110,y:330,align:'left',color:C.mist});
    s.l2=MD.word(h,'THE COLLEGE',{cls:'f-unb',size:96,x:104,y:470,align:'left',color:C.brand});
    s.l3=MD.word(h,'IS THE NODE.',{cls:'f-unb',size:96,x:104,y:585,align:'left',color:C.ink});
    s.sub=MD.word(h,'every complaint · every action · every bureau → one institution',{cls:'f-mono',size:18,x:112,y:700,align:'left',color:C.ink,mask:false,style:'font-weight:600'});},
  update(t,s){const c=s.c;c.clearRect(0,0,W,H);
    T.maskRise(s.l1.letters,t,{at:0,stagger:.012,dur:.3});
    c.fillStyle=C.alert;c.fillRect(110,328,P(t,B*.9,.3,E.expoOut)*tw(c,'NOT THE COMPLAINT.',UNB(52)),6);
    T.slam(s.l2.letters,t,{at:B*1,stagger:.025,dur:.14,dist:500});T.slam(s.l3.letters,t,{at:B*1.35,stagger:.025,dur:.14,dist:500});
    T.typeOn(s.sub.letters,t,{at:B*2.4,cps:80});
    const cx=1440,cy=540;
    BUR.forEach(([n,col],i)=>{const a=-PI/2+i*PI/3,at=B*(.25+i*.42),p=E.spring(clamp((t-at)/.6),1.4,5);if(t<at)return;
      const x=cx+Math.cos(a)*300*p,y=cy+Math.sin(a)*300*p;
      c.strokeStyle='rgba(11,20,51,.25)';c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();
      // case dots streaming into the hub
      for(let k=0;k<3;k++){const u=((t*1.4+k/3+i*.13)%1);c.fillStyle=col;c.beginPath();c.arc(lerp(x,cx,u),lerp(y,cy,u),5,0,7);c.fill();}
      c.fillStyle=col;c.beginPath();c.arc(x,y,40+5*MD.pulse(t,8),0,7);c.fill();
      txt(c,n,x,y+(Math.sin(a)>0.2?78:-58),{font:MONO(15,700),col:C.ink,align:'center',ls:3,a:clamp(p)});});
    pop(c,cx,cy,t,0,()=>{c.fillStyle=C.ink;c.beginPath();c.arc(cx,cy,92+6*MD.pulse(t,8),0,7);c.fill();mark(c,cx,cy-4,48,C.saff,{grow:1,hub:C.ice});},{dur:.4});
  }});
MD.overlays.push(t=>X.shapeWipe(t,bar(4),HEX,{color:C.ice,x:1440,y:540}));

// =====================================================================================================
// CHAPTERS
// =====================================================================================================
// 01 DASHBOARD -----------------------------------------------------------------------------------------
chapter(1,{name:['DASHBOARD'],kicker:'COMMAND CENTRE · 6 BUREAUS · 9 CHANNELS',claim:['Everything that needs','attention. First.'],bg:C.ice,fg:C.ink,acc:C.brand,
  draw(c,t){
    const K=[['INSTITUTIONS',164,'',C.brand],['OPEN COMPLAINTS',380,'',C.alert],['ACTIVE ACTIONS',38,'',C.saff],["CLOSED WITH COMPLAINANT'S OK",91,'%',C.teal]];
    K.forEach(([lab,v,suf,col],i)=>{const x=930+(i%2)*450,y=165+Math.floor(i/2)*195,at=B*(.4+i*.42);
      pop(c,x+210,y+85,t,at,()=>{card(c,x,y,420,170,{fill:'#fff'});c.fillStyle=col+'22';c.beginPath();c.arc(x+62,y+85,34,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(x+62,y+85,13+3*MD.pulse(t,8),0,7);c.fill();
        txt(c,lab,x+116,y+64,{font:MONO(13,700),col:C.mist,ls:2});
        const val=Math.round(v*P(t,at+.05,.8,E.expoOut));txt(c,val+suf,x+114,y+128,{font:UNB(52),col:C.ink});});});
    // donut: complaints by bureau (live numbers from the app)
